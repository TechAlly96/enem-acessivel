name: Narrar e publicar

# Roda quando o conteudo, o gerador ou o app mudam (e manualmente).
# Narra so o que mudou (cache por questao) e publica no GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["conteudo/**", "gerador/**", "app/**", ".github/workflows/publicar.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-enem
  cancel-in-progress: false

jobs:
  narrar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5

      - name: Montar dados do app (conteudo/*.md -> JSON)
        run: python3 gerador/montar_dados.py dados

      - name: Cache das ferramentas de voz (ffmpeg estatico + Piper)
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ffmpeg-estatico
            /tmp/piper
          key: voz-ferramentas-v1

      - name: Preparar voz (Piper em ambiente isolado + ffmpeg estatico)
        run: |
          if ! /tmp/piper/bin/python -c "import piper" 2>/dev/null; then
            rm -rf /tmp/piper
            python3 -m venv /tmp/piper
            /tmp/piper/bin/pip install --quiet piper-tts
          fi
          if ! command -v ffmpeg >/dev/null; then
            if [ ! -x /tmp/ffmpeg-estatico/ffmpeg ]; then
              mkdir -p /tmp/ffmpeg-estatico
              curl -sSL --retry 4 --max-time 300 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
                | tar -xJ --strip-components=2 -C /tmp/ffmpeg-estatico --wildcards '*/bin/ffmpeg' || rm -rf /tmp/ffmpeg-estatico
            fi
            if [ -x /tmp/ffmpeg-estatico/ffmpeg ]; then
              echo /tmp/ffmpeg-estatico >> "$GITHUB_PATH"
            else
              sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
            fi
          fi

      - name: Cache do modelo de voz
        uses: actions/cache@v4
        with:
          path: vozes
          key: vozes-v1

      - name: Recuperar audio ja narrado (por questao)
        uses: actions/cache/restore@v4
        with:
          path: audio-cache
          key: audio-v1-${{ github.run_id }}
          restore-keys: audio-v1-

      - name: Narrar as partes (voz faber)
        timeout-minutes: 120
        continue-on-error: true
        env:
          PIPER_PY: /tmp/piper/bin/python
          VOZES_DIR: ${{ github.workspace }}/vozes
          AUDIO_CACHE: ${{ github.workspace }}/audio-cache
          DADOS: ${{ github.workspace }}/dados
        run: |
          mkdir -p logs
          ls dados | grep -v '[.]json$' | xargs -P 4 -I{} sh -c 'python3 -u gerador/narrar.py {} > logs/{}.log 2>&1 || echo "::warning::Narracao de {} incompleta"'
          for f in logs/*.log; do echo "::group::$(basename "$f" .log)"; cat "$f"; echo "::endgroup::"; done

      - name: Guardar audio narrado (mesmo se a narracao parar no meio)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: audio-cache
          key: audio-v1-${{ github.run_id }}

      - name: Duracoes no indice e montagem do site
        run: |
          python3 gerador/montar_dados.py dados --duracoes
          mkdir -p _site/app
          cp -r app/. _site/app/
          cp -r dados _site/dados
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Enem Acessível</title><meta http-equiv="refresh" content="0; url=app/"><a href="app/">Abrir o Enem Acessível</a>' > _site/index.html
          du -sh _site | sed 's/^/  total do site: /'
          find _site -name '*.ogg' -printf '%s\n' | awk '{s+=$1; n++} END {printf "  audio: %d arquivos, %.1f MB\n", n, s/1048576}'

      - name: Enviar site para o Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: narrar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        continue-on-error: true  # teto fixo de 10 min da acao (licao do GIN, sprint-051)
        uses: actions/deploy-pages@v4

      - name: Aguardar antes da segunda tentativa
        if: always() && steps.deploy.outcome != 'success'
        run: sleep 90

      - name: Publicar no GitHub Pages (segunda tentativa)
        id: deploy2
        if: always() && steps.deploy.outcome != 'success'
        uses: actions/deploy-pages@v4
